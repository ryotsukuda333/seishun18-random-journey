name = "seishun18-random-journey-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
FRONTEND_ORIGIN = "http://localhost:5174"
SUPABASE_URL = "http://localhost:54321"
SUPABASE_ANON_KEY = ""

[[kv_namespaces]]
binding = "STATION_CACHE"
id = "STATION_CACHE_PROD"
preview_id = "STATION_CACHE_PREVIEW"

[[kv_namespaces]]
binding = "JOURNEY_RATE_LIMIT"
id = "JOURNEY_RATE_LIMIT_PROD"
preview_id = "JOURNEY_RATE_LIMIT_PREVIEW"

[[kv_namespaces]]
binding = "STATION_SEARCH_RATE_LIMIT"
id = "STATION_SEARCH_RATE_LIMIT_PROD"
preview_id = "STATION_SEARCH_RATE_LIMIT_PREVIEW"
